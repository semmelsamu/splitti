<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splitti Wireframe – Wer bist du?</title>
<style>body{margin:0;background:#e5e5e5;display:flex;justify-content:center;font-family:Inter,system-ui,sans-serif}a{color:#1d4ed8}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #1a1a1a; font-family: Inter, sans-serif; font-size: 15px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; min-height: 44px; padding: 8px 16px; border-bottom: 1px solid #d4d4d4">
<div style="font-size: 17px; font-weight: 600">WG</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 24px 16px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Wer bist du?</h1>
<p style="margin: 0 0 8px; font-size: 14px; color: #595959">Dieses Gerät merkt sich deine Wahl. Sie belegt „Bezahlt von“ vor und steht im Änderungsverlauf.</p>
<button style="min-height: 56px; padding: 0 16px; border: 1px solid #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 16px; font-weight: 500; text-align: left">[Dein Name]</button>
<button style="min-height: 56px; padding: 0 16px; border: 1px solid #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 16px; font-weight: 500; text-align: left">Karl</button>
<button style="min-height: 56px; padding: 0 16px; border: 1px solid #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 16px; font-weight: 500; text-align: left">Rosi</button>
<button style="min-height: 56px; padding: 0 16px; border: 1px solid #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 16px; font-weight: 500; text-align: left">[Name]</button>
<button style="min-height: 56px; padding: 0 16px; border: 1px dashed #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 15px; text-align: left">+ Ich bin neu in der Gruppe</button>
</div>
<div style="padding: 12px 16px 20px; font-size: 13px; color: #595959">Später änderbar in den Gruppeneinstellungen.</div>
</div>
</body>
</html>
