<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splitti Wireframe – Gruppe erstellen</title>
<style>body{margin:0;background:#e5e5e5;display:flex;justify-content:center;font-family:Inter,system-ui,sans-serif}a{color:#1d4ed8}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #1a1a1a; font-family: Inter, sans-serif; font-size: 15px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #d4d4d4">
<button aria-label="Zurück" style="width: 44px; height: 44px; border: none; background: none; color: #1a1a1a; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<h1 style="margin: 0; font-size: 17px; font-weight: 600; flex: 1">Gruppe erstellen</h1>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="g-name" style="font-size: 13px; font-weight: 600; color: #595959">Name der Gruppe</label>
<input id="g-name" type="text" value="WG" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #6b6b6b; border-radius: 8px; font-family: inherit; font-size: 16px; color: #1a1a1a">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="g-me" style="font-size: 13px; font-weight: 600; color: #595959">Dein Name</label>
<input id="g-me" type="text" value="[Dein Name]" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #6b6b6b; border-radius: 8px; font-family: inherit; font-size: 16px; color: #1a1a1a">
<div style="font-size: 13px; color: #595959">Dieses Gerät wird dir zugeordnet.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 600; color: #595959">Weitere Mitglieder</div>
<div style="border: 1px solid #d4d4d4; border-radius: 8px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; padding: 0 4px 0 14px; border-bottom: 1px solid #e5e5e5"><span style="flex: 1">Karl</span><button aria-label="Karl entfernen" style="width: 44px; height: 44px; border: none; background: none; color: #595959; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div style="display: flex; align-items: center; padding: 0 4px 0 14px"><span style="flex: 1">Rosi</span><button aria-label="Rosi entfernen" style="width: 44px; height: 44px; border: none; background: none; color: #595959; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
</div>
<div style="display: flex; gap: 8px">
<label for="g-new" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Name des neuen Mitglieds</label>
<input id="g-new" type="text" placeholder="Name" style="flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #6b6b6b; border-radius: 8px; font-family: inherit; font-size: 16px; color: #1a1a1a">
<button style="min-height: 48px; padding: 0 16px; border: 1px solid #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 15px; font-weight: 600">Hinzufügen</button>
</div>
<div style="font-size: 13px; color: #595959">Mitglieder kannst du auch später ergänzen. Wer den Link öffnet, wählt seinen Namen aus dieser Liste.</div>
</div>
</div>
<div style="padding: 12px 16px 20px; border-top: 1px solid #d4d4d4; background: #f5f5f5; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; color: #595959">Danach öffnet sich die Gruppe; den Einladungslink teilst du dort über „Link teilen“.</div>
<button style="min-height: 48px; border: none; border-radius: 8px; background: #1d4ed8; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 600">Gruppe erstellen</button>
</div>
</div>
</body>
</html>
