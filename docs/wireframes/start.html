<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splitti Wireframe – Start</title>
<style>body{margin:0;background:#e5e5e5;display:flex;justify-content:center;font-family:Inter,system-ui,sans-serif}a{color:#1d4ed8}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #1a1a1a; font-family: Inter, sans-serif; font-size: 15px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; min-height: 44px; padding: 8px 16px; border-bottom: 1px solid #d4d4d4">
<h1 style="margin: 0; font-size: 17px; font-weight: 600">Splitti</h1>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 16px">
<h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #595959">Deine Gruppen auf diesem Gerät</h2>
<div style="border: 1px solid #d4d4d4; border-radius: 8px; display: flex; flex-direction: column">
<button style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 14px; border: none; border-bottom: 1px solid #e5e5e5; background: none; color: #1a1a1a; font-family: inherit; font-size: 15px; text-align: left">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">WG</span><span style="font-size: 13px; color: #595959">4 Mitglieder · du bekommst 12,40 €</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 14px; border: none; background: none; color: #1a1a1a; font-family: inherit; font-size: 15px; text-align: left">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">[Zweite Gruppe]</span><span style="font-size: 13px; color: #595959">[Anzahl] Mitglieder · ausgeglichen</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>
<p style="margin: 8px 0 0; font-size: 13px; color: #595959">Einladungslink bekommen? Öffne ihn auf diesem Gerät, dann erscheint die Gruppe hier.</p>
</div>
<div style="padding: 12px 16px 20px; border-top: 1px solid #d4d4d4; background: #f5f5f5; display: flex; flex-direction: column">
<button style="min-height: 52px; border: none; border-radius: 8px; background: #1d4ed8; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 600">Gruppe erstellen</button>
</div>
</div>
</body>
</html>
