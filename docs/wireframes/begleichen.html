<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #1a1a1a; font-family: Inter, sans-serif; font-size: 15px; display: flex; flex-direction: column">

<div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 16px">
<p style="margin: 0; font-size: 14px; color: #595959">Mit diesen 3 Überweisungen sind alle Salden ausgeglichen.</p>
<div style="border: 1px solid #d4d4d4; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px">

<button style="min-height: 44px; border: 1px solid #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 14px; font-weight: 600">Als bezahlt eintragen</button>
</div>
<div style="border: 1px solid #d4d4d4; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline"><span style="flex: 1"><strong>Rosi</strong> zahlt an <strong>Du</strong></span><span style="font-size: 17px; font-weight: 600">4,25 €</span></div>
<button style="min-height: 44px; border: 1px solid #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 14px; font-weight: 600">Als bezahlt eintragen</button>
</div>
<div style="border: 1px solid #d4d4d4; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px">

<button style="min-height: 44px; border: 1px solid #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 14px; font-weight: 600">Als bezahlt eintragen</button>
</div>
<p style="margin: 0; font-size: 13px; color: #595959">Eine eingetragene Zahlung erscheint im Verlauf und lässt sich dort wieder löschen.</p>
</div>
<div style="padding: 12px 16px 20px; border-top: 1px solid #d4d4d4; background: #f5f5f5; display: flex; flex-direction: column">
<button style="min-height: 52px; border: 1px solid #6b6b6b; border-radius: 8px; background: #ffffff; color: #1a1a1a; font-family: inherit; font-size: 16px; font-weight: 600">Andere Zahlung eintragen</button>
