# Vorlage für die compose.yaml im Repo-Wurzelverzeichnis.
# Image-Bau, Port und Datenordner dürfen angepasst werden;
# der auskommentierte Netzwerk-Block muss in dieser Form erhalten bleiben.

services:
  splitti:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SPLITTI_PORT:-3000}:3000"
    volumes:
      - ./data:/data

    # --- Proxy-Netzwerk (Nginx Proxy Manager) -------------------------
    # Zum Anbinden die zwei folgenden Zeilen einkommentieren
    # und ganz unten den Namen des Proxy-Netzwerks eintragen.
    # networks:
    #   - proxy

# networks:
#   proxy:
#     external: true
#     name: HIER_NAME_DES_PROXY_NETZWERKS
