name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # The receipt tests run the real text recognition. The German language
      # model comes from the repo (tessdata/).
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install the browser for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build and browser tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and start the stack
        run: docker compose up -d --build

      - name: Wait for the health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop the stack
        if: always()
        run: docker compose down
